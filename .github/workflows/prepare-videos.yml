name: Prepare exercise videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/data/program.ts
      - scripts/prepare-videos.mjs
      - .github/workflows/prepare-videos.yml

permissions:
  contents: write

concurrency:
  group: exercise-videos-v2
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish video release
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_RELEASE_ONLY: 1
        run: node scripts/prepare-videos.mjs

  prepare:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install FFmpeg when missing
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Convert and upload videos
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_SOURCE_BYTES: 209715200
          VIDEO_SHARD_COUNT: 8
          VIDEO_SHARD_INDEX: ${{ matrix.shard }}
        run: node scripts/prepare-videos.mjs
